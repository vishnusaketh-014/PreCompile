[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "precompile"
version = "0.1.0"
description = "Anticipatory, confidence-gated scheduling priority reservation for software builds"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary / Research" }
authors = [
    { name = "PreCompile Team" }
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
precompile = "precompile.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["precompile*"]
